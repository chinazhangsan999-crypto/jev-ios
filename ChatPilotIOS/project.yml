name: ChatPilot
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
targets:
  ChatPilot:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    resources:
      - Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Configuration/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.chatpilot
        INFOPLIST_FILE: Configuration/App-Info.plist
    dependencies:
      - target: ChatPilotBroadcast
        embed: true
      - target: ChatPilotKeyboard
        embed: true
  ChatPilotBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - Broadcast
      - Shared
    resources:
      - Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Configuration/Broadcast.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.chatpilot.broadcast
        INFOPLIST_FILE: Configuration/Broadcast-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ChatPilotKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared/Models.swift
      - Shared/SharedStore.swift
    resources:
      - Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Configuration/Keyboard.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.chatpilot.keyboard
        INFOPLIST_FILE: Configuration/Keyboard-Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ChatPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: ChatPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.chatpilot.tests
schemes:
  ChatPilot:
    build:
      targets:
        ChatPilot: all
        ChatPilotBroadcast: all
        ChatPilotKeyboard: all
        ChatPilotTests: [test]
    test:
      targets:
        - ChatPilotTests
